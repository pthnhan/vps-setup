services:
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: ${MONGO_EXPRESS_CONTAINER_NAME:-mongo-express}
    restart: unless-stopped
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_BASICAUTH_USERNAME:?set MONGO_EXPRESS_BASICAUTH_USERNAME in .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_BASICAUTH_PASSWORD:?set MONGO_EXPRESS_BASICAUTH_PASSWORD in .env}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: ${MONGO_EXPRESS_MONGODB_ENABLE_ADMIN:-true}
      ME_CONFIG_MONGODB_SERVER: ${MONGO_EXPRESS_MONGODB_SERVER:-mongodb}
      ME_CONFIG_MONGODB_PORT: ${MONGO_EXPRESS_MONGODB_PORT:-27017}
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_EXPRESS_MONGODB_ADMINUSERNAME:?set MONGO_EXPRESS_MONGODB_ADMINUSERNAME in .env}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_EXPRESS_MONGODB_ADMINPASSWORD:?set MONGO_EXPRESS_MONGODB_ADMINPASSWORD in .env}
      ME_CONFIG_OPTIONS_EDITORTHEME: ${MONGO_EXPRESS_OPTIONS_EDITORTHEME:-default}
      ME_CONFIG_SITE_COOKIESECRET: ${MONGO_EXPRESS_SITE_COOKIESECRET:?set MONGO_EXPRESS_SITE_COOKIESECRET in .env}
      ME_CONFIG_SITE_SESSIONSECRET: ${MONGO_EXPRESS_SITE_SESSIONSECRET:?set MONGO_EXPRESS_SITE_SESSIONSECRET in .env}
      TZ: ${TZ:-UTC}
    ports:
      - "${MONGO_EXPRESS_BIND_IP:-127.0.0.1}:${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      database_network:
        aliases:
          - ${MONGO_EXPRESS_NETWORK_ALIAS:-mongo-express}

networks:
  database_network:
    external: true
    name: ${DATABASE_NETWORK_NAME:-database_network}
