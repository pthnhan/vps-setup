services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME:-pgadmin}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: ${PGADMIN_DISABLE_POSTFIX:-1}
      TZ: ${TZ:-UTC}
    ports:
      - "${PGADMIN_BIND_IP:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      database_network:
        aliases:
          - ${PGADMIN_NETWORK_ALIAS:-pgadmin}

volumes:
  pgadmin_data:
    name: ${PGADMIN_VOLUME_NAME:-pgadmin_data}

networks:
  database_network:
    external: true
    name: ${DATABASE_NETWORK_NAME:-database_network}
